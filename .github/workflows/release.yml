name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      - name: Refuse to publish a tag that disagrees with package.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - run: bun run validate
      - run: bun run test:extended
      - run: bun run build

      - name: Publish with trusted publishing
        run: |
          npm install -g npm@latest
          npm publish
